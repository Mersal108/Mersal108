<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 190" width="800" height="190" role="img" aria-labelledby="title">
  <title id="title">A koi pond as it looks now: sunset in Cairo</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="190" rx="18"/></clipPath>
    <clipPath id="aboveWater"><rect width="800" height="142"/></clipPath>
    <path id="pad" d="M0 0L21.25 -5.69A22 22 0 1 0 21.25 5.69Z"/>
    
    <path id="body" d="M26 0C25-6 14-8.5 2-8C-10-7.5-20-4-26 0C-20 4-10 7.5 2 8C14 8.5 25 6 26 0Z"/>
    <clipPath id="bodyClip"><use href="#body" xlink:href="#body"/></clipPath>
    <g id="tail"><path d="M-23 0Q-33-2-43-11Q-38 0-43 11Q-33 2-23 0Z">
      <animateTransform attributeName="transform" type="rotate" values="-14 -23 0;14 -23 0;-14 -23 0" dur="0.9s" repeatCount="indefinite"/></path></g>
    <g id="fins"><path d="M12-6Q4-17-3-15Q3-10 8-6Z"/><path d="M12 6Q4 17-3 15Q3 10 8 6Z"/></g>
    
    <g id="kohaku">
      
      <use href="#tail" xlink:href="#tail" fill="#fde2d4" opacity="0.85"/>
      <use href="#fins" xlink:href="#fins" fill="#fef3ee" opacity="0.8"/>
      <use href="#body" xlink:href="#body" fill="#f8fafc"/>
      <g clip-path="url(#bodyClip)"><ellipse cx="15" cy="-1" rx="9" ry="6" fill="#ef4444"/><ellipse cx="-6" cy="3" rx="9" ry="5" fill="#ef4444"/></g>
      <circle cx="20" cy="-3.6" r="1.3" fill="#0f172a"/><circle cx="20" cy="3.6" r="1.3" fill="#0f172a"/>
    </g>
    <path id="jump" d="M300 160Q370 40 440 160"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="190" fill="url(#sky)"/>
    <g fill="#e0e7ff" opacity="0.3">
      <circle cx="320" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="55" r="1.1"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="530" cy="24" r="1.6"><animate attributeName="opacity" values="1;0.25;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="92" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="88" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="100" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="687.9" cy="117.7" r="80" fill="url(#glow)"/>
    <circle cx="687.9" cy="117.7" r="26" fill="#fb923c"/>
    
    <g fill="#fdba74" opacity="0.5">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-120 0;920 0" dur="90s" begin="-30s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="44" rx="42" ry="11"/><ellipse cx="-16" cy="36" rx="20" ry="11"/><ellipse cx="12" cy="34" rx="22" ry="13"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="-120 0;920 0" dur="120s" begin="-85s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="82" rx="34" ry="9"/><ellipse cx="-10" cy="75" rx="18" ry="9"/><ellipse cx="12" cy="74" rx="16" ry="10"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="-120 0;920 0" dur="105s" begin="-10s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="22" rx="28" ry="8"/><ellipse cx="8" cy="15" rx="16" ry="9"/>
      </g>
    </g>

    <rect y="140" width="800" height="50" fill="url(#water)"/>
    <g stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M40 158h40M520 170h50M690 160h30M200 176h36">
        <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    <ellipse cx="687.9" cy="152" rx="30" ry="4" fill="#fb923c" opacity="0.35">
      <animate attributeName="rx" values="30;24;30" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <g clip-path="url(#aboveWater)">
      <use href="#kohaku" xlink:href="#kohaku" opacity="0">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;0;1;1" keyTimes="0;0.55;0.8;1" calcMode="linear"><mpath href="#jump" xlink:href="#jump"/></animateMotion>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.79;0.8;1" dur="7s" repeatCount="indefinite"/>
      </use>
    </g>
    <g fill="none" stroke="#fed7aa" stroke-width="1.5">
      <ellipse cx="305" cy="146" rx="0" ry="0">
        <animate attributeName="rx" values="0;0;22;22" keyTimes="0;0.55;0.7;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="0;0;5;5" keyTimes="0;0.55;0.7;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.55;0.56;0.7;1" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="435" cy="146" rx="0" ry="0">
        <animate attributeName="rx" values="0;0;24;24" keyTimes="0;0.79;0.95;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="0;0;5;5" keyTimes="0;0.79;0.95;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.79;0.8;0.95;1" dur="7s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="4s" repeatCount="indefinite"/>
      <use href="#pad" xlink:href="#pad" fill="#22c55e" transform="translate(120 160) rotate(30) scale(1 0.45)"/>
      <use href="#pad" xlink:href="#pad" fill="#16a34a" transform="translate(560 172) rotate(160) scale(0.9 0.4)"/>
      <use href="#pad" xlink:href="#pad" fill="#15803d" transform="translate(455 183) rotate(-40) scale(0.7 0.35)"/>
      <use href="#pad" xlink:href="#pad" fill="#16a34a" transform="translate(220 180) rotate(210) scale(0.6 0.3)"/>
    </g>

    <text x="778" y="178" text-anchor="end" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#f8fafc" opacity="0.7">sunset in Cairo</text>
  </g>
</svg>
