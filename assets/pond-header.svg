<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 190" width="800" height="190" role="img" aria-labelledby="title">
  <title id="title">A koi pond at night: a koi jumps, lily pads float under the moon</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.7" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#3b4fa8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#bfdbfe" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="800" height="190" rx="18"/></clipPath>
    <clipPath id="aboveWater"><rect width="800" height="142"/></clipPath>

    <!-- koi, head pointing +x -->
    <path id="body" d="M26 0C25-6 14-8.5 2-8C-10-7.5-20-4-26 0C-20 4-10 7.5 2 8C14 8.5 25 6 26 0Z"/>
    <clipPath id="bodyClip"><use href="#body" xlink:href="#body"/></clipPath>
    <g id="koi">
      <g fill="#fde2d4" opacity="0.9">
        <path d="M-23 0Q-33-2-43-11Q-38 0-43 11Q-33 2-23 0Z">
          <animateTransform attributeName="transform" type="rotate" values="-16 -23 0;16 -23 0;-16 -23 0" dur="0.5s" repeatCount="indefinite"/>
        </path>
      </g>
      <g fill="#fef3ee" opacity="0.8">
        <path d="M12-6Q4-17-3-15Q3-10 8-6Z"/>
        <path d="M12 6Q4 17-3 15Q3 10 8 6Z"/>
      </g>
      <use href="#body" xlink:href="#body" fill="#f8fafc"/>
      <g clip-path="url(#bodyClip)" fill="#ef4444">
        <ellipse cx="15" cy="-1" rx="9" ry="6"/>
        <ellipse cx="-6" cy="3" rx="9" ry="5"/>
      </g>
      <circle cx="20" cy="-3.6" r="1.3" fill="#0f172a"/>
      <circle cx="20" cy="3.6" r="1.3" fill="#0f172a"/>
    </g>

    <path id="pad" d="M0 0L21.25 -5.69A22 22 0 1 0 21.25 5.69Z"/>

    <path id="jump" d="M300 160Q370 40 440 160"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="190" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#e0e7ff">
      <circle cx="320" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="55" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="530" cy="24" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="92" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="88" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="100" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
    <!-- sparkle -->
    <g fill="#fde68a" transform="translate(380 40)">
      <path d="M0-7L1.6-1.6L7 0L1.6 1.6L0 7L-1.6 1.6L-7 0L-1.6-1.6Z">
        <animateTransform attributeName="transform" type="scale" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#bfdbfe" transform="translate(720 110)">
      <path d="M0-6L1.4-1.4L6 0L1.4 1.4L0 6L-1.4 1.4L-6 0L-1.4-1.4Z">
        <animateTransform attributeName="transform" type="scale" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- moon -->
    <circle cx="660" cy="62" r="70" fill="url(#glow)"/>
    <circle cx="660" cy="62" r="30" fill="#e2e8f0"/>
    <circle cx="650" cy="54" r="5" fill="#cbd5e1" opacity="0.8"/>
    <circle cx="670" cy="72" r="3.5" fill="#cbd5e1" opacity="0.8"/>
    <!-- water -->
    <rect y="140" width="800" height="50" fill="url(#water)"/>
    <g stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5">
      <path d="M40 158h40M520 170h50M690 160h30M200 176h36">
        <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- moon on the water -->
    <ellipse cx="660" cy="152" rx="30" ry="4" fill="#e2e8f0" opacity="0.35">
      <animate attributeName="rx" values="30;24;30" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- the jumping koi, only visible above the water -->
    <g clip-path="url(#aboveWater)">
      <use href="#koi" xlink:href="#koi" opacity="0">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;0;1;1" keyTimes="0;0.55;0.8;1" calcMode="linear"><mpath href="#jump" xlink:href="#jump"/></animateMotion>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.56;0.79;0.8;1" dur="7s" repeatCount="indefinite"/>
      </use>
    </g>
    <!-- splashes -->
    <g fill="none" stroke="#dbeafe" stroke-width="1.5">
      <ellipse cx="305" cy="146" rx="0" ry="0">
        <animate attributeName="rx" values="0;0;22;22" keyTimes="0;0.55;0.7;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="0;0;5;5" keyTimes="0;0.55;0.7;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.55;0.56;0.7;1" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="435" cy="146" rx="0" ry="0">
        <animate attributeName="rx" values="0;0;24;24" keyTimes="0;0.79;0.95;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="0;0;5;5" keyTimes="0;0.79;0.95;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.79;0.8;0.95;1" dur="7s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g fill="#dbeafe">
      <circle cx="430" cy="140" r="2">
        <animate attributeName="cy" values="140;140;124;142;142" keyTimes="0;0.8;0.86;0.92;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.81;0.92;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="442" cy="140" r="1.6">
        <animate attributeName="cy" values="140;140;128;142;142" keyTimes="0;0.8;0.85;0.9;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.81;0.9;1" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- lily pads -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="4s" repeatCount="indefinite"/>
      <use href="#pad" xlink:href="#pad" fill="#22c55e" transform="translate(120 160) rotate(30) scale(1 0.45)"/>
      <use href="#pad" xlink:href="#pad" fill="#16a34a" transform="translate(560 172) rotate(160) scale(0.9 0.4)"/>
      <use href="#pad" xlink:href="#pad" fill="#15803d" transform="translate(760 168) rotate(-40) scale(0.7 0.35)"/>
      <use href="#pad" xlink:href="#pad" fill="#16a34a" transform="translate(220 180) rotate(210) scale(0.6 0.3)"/>
    </g>

  </g>
</svg>
