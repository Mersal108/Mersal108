<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 175" width="200" height="175" role="img" aria-labelledby="title">
  <title id="title">A little frog on a lily pad waving hello</title>

  <!-- speech bubble -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.4s" repeatCount="indefinite"/>
    <rect x="112" y="6" width="80" height="30" rx="15" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <path d="M132 35L126 46L142 35Z" fill="#fdf2f8" stroke="#f472b6" stroke-width="2" stroke-linejoin="round"/>
    <rect x="128" y="32" width="16" height="4" fill="#fdf2f8"/>
    <text x="152" y="26" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="14" font-weight="700" fill="#be185d">hi there!</text>
  </g>

  <!-- lily pad -->
  <path d="M100 158L178.25 154.26A80 18 0 1 0 178.25 161.74Z" fill="#16a34a"/>
  <ellipse cx="100" cy="154" rx="64" ry="12" fill="#22c55e" opacity="0.6"/>

  <!-- ripples -->
  <g fill="none" stroke="#93c5fd" stroke-width="1.5">
    <ellipse cx="100" cy="158" rx="84" ry="20" opacity="0">
      <animate attributeName="rx" values="84;98" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="20;26" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g>
    <!-- gentle breathing -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2s" repeatCount="indefinite"/>

    <!-- waving arm (behind the body) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 136 120;-30 136 120;0 136 120" dur="1.1s" repeatCount="indefinite"/>
      <path d="M134 122Q152 108 158 88" stroke="#4ade80" stroke-width="10" fill="none" stroke-linecap="round"/>
      <circle cx="158" cy="86" r="7" fill="#4ade80"/>
      <circle cx="153" cy="80" r="3" fill="#4ade80"/>
      <circle cx="160" cy="78" r="3" fill="#4ade80"/>
      <circle cx="165" cy="83" r="3" fill="#4ade80"/>
    </g>

    <!-- body -->
    <ellipse cx="100" cy="120" rx="44" ry="32" fill="#4ade80"/>
    <ellipse cx="100" cy="130" rx="28" ry="20" fill="#bbf7d0"/>
    <!-- resting arm -->
    <path d="M66 128Q60 140 70 146" stroke="#22c55e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- feet -->
    <ellipse cx="72" cy="150" rx="14" ry="5" fill="#22c55e"/>
    <ellipse cx="128" cy="150" rx="14" ry="5" fill="#22c55e"/>

    <!-- eye bumps -->
    <circle cx="80" cy="90" r="15" fill="#4ade80"/>
    <circle cx="120" cy="90" r="15" fill="#4ade80"/>
    <!-- eyes, blinking -->
    <g>
      <ellipse cx="80" cy="89" rx="10" ry="10" fill="#ffffff">
        <animate attributeName="ry" values="10;10;1;10" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="120" cy="89" rx="10" ry="10" fill="#ffffff">
        <animate attributeName="ry" values="10;10;1;10" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="82" cy="90" rx="5.5" ry="5.5" fill="#0f172a">
        <animate attributeName="ry" values="5.5;5.5;0.6;5.5" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="122" cy="90" rx="5.5" ry="5.5" fill="#0f172a">
        <animate attributeName="ry" values="5.5;5.5;0.6;5.5" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="84" cy="87" r="1.8" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="124" cy="87" r="1.8" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- cheeks and smile -->
    <ellipse cx="72" cy="113" rx="7" ry="4" fill="#f9a8d4" opacity="0.85"/>
    <ellipse cx="128" cy="113" rx="7" ry="4" fill="#f9a8d4" opacity="0.85"/>
    <path d="M89 114Q100 124 111 114" stroke="#166534" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- tiny blossom on its head -->
    <g transform="translate(100 82) scale(0.7)">
      <g fill="#fbcfe8">
        <ellipse cx="0" cy="-6" rx="4.2" ry="6"/>
        <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(288)"/>
      </g>
      <circle r="2.6" fill="#f472b6"/>
    </g>
  </g>
</svg>
