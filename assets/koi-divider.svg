<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 40" width="800" height="40" role="img" aria-labelledby="title">
  <title id="title">A small koi swims across</title>
  <defs>
    <path id="body" d="M26 0C25-6 14-8.5 2-8C-10-7.5-20-4-26 0C-20 4-10 7.5 2 8C14 8.5 25 6 26 0Z"/>
    <clipPath id="bodyClip"><use href="#body" xlink:href="#body"/></clipPath>
    <g id="koi">
      <path d="M-23 0Q-33-2-43-11Q-38 0-43 11Q-33 2-23 0Z" fill="#fdba74" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" values="-14 -23 0;14 -23 0;-14 -23 0" dur="0.8s" repeatCount="indefinite"/>
      </path>
      <g fill="#fed7aa" opacity="0.85">
        <path d="M12-6Q4-17-3-15Q3-10 8-6Z"/>
        <path d="M12 6Q4 17-3 15Q3 10 8 6Z"/>
      </g>
      <use href="#body" xlink:href="#body" fill="#fb923c"/>
      <g clip-path="url(#bodyClip)" fill="#f8fafc">
        <ellipse cx="14" cy="-2" rx="7" ry="5"/>
        <ellipse cx="-10" cy="3" rx="7" ry="4"/>
      </g>
      <circle cx="20" cy="-3.6" r="1.3" fill="#0f172a"/>
      <circle cx="20" cy="3.6" r="1.3" fill="#0f172a"/>
    </g>
    <path id="swim" d="M-60 20C100 10 200 30 400 20C600 10 700 30 860 20"/>
  </defs>

  <!-- a wavy line of water -->
  <path d="M0 20Q25 14 50 20T100 20T150 20T200 20T250 20T300 20T350 20T400 20T450 20T500 20T550 20T600 20T650 20T700 20T750 20T800 20" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- bubbles -->
  <g fill="none" stroke="#93c5fd" stroke-width="1.3">
    <circle cx="180" cy="26" r="3"><animate attributeName="cy" values="26;6" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="26" r="2.4"><animate attributeName="cy" values="26;6" dur="3.6s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="26" r="2"><animate attributeName="cy" values="26;8" dur="2.8s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.8s" begin="-2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- tiny blossoms floating on the line -->
  <g transform="translate(300 20) scale(0.6)">
    <g fill="#f9a8d4">
      <ellipse cx="0" cy="-6" rx="4.2" ry="6"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(72)"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(144)"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(216)"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(288)"/>
    </g>
    <circle r="2.6" fill="#f472b6"/>
  </g>
  <g transform="translate(560 20) scale(0.5)">
    <g fill="#f9a8d4">
      <ellipse cx="0" cy="-6" rx="4.2" ry="6"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(72)"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(144)"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(216)"/>
      <ellipse cx="0" cy="-6" rx="4.2" ry="6" transform="rotate(288)"/>
    </g>
    <circle r="2.6" fill="#f472b6"/>
  </g>

  <use href="#koi" xlink:href="#koi" transform="scale(0.7)">
    <animateMotion dur="14s" repeatCount="indefinite" rotate="auto"><mpath href="#swim" xlink:href="#swim"/></animateMotion>
  </use>
</svg>
