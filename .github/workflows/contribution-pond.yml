# Draws the contribution graph as a koi pond (scripts/contribution-pond.mjs)
# and publishes it to the `output` branch, which README.md links to.
name: Contribution pond

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contribution-pond.mjs
      - .github/workflows/contribution-pond.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Draw the pond
        run: |
          mkdir -p dist
          node scripts/contribution-pond.mjs "${{ github.repository_owner }}" dist/contribution-pond.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
