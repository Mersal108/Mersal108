# Draws the "Contribution Pond" in README.md: a snake that eats the
# contribution graph, in the pond colours. It writes the SVGs to the
# `output` branch, which the README links to.
name: Contribution pond

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pond-snake.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pond-snake.svg?color_snake=#fb923c&color_dots=#e0f2fe,#fbcfe8,#f9a8d4,#f472b6,#db2777
            dist/pond-snake-dark.svg?palette=github-dark&color_snake=#fb923c&color_dots=#172554,#831843,#be185d,#ec4899,#f9a8d4

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
