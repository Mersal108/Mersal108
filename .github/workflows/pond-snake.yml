# Draws the "Contribution Pond" in README.md: a snake that eats the
# contribution graph, in koi orange and pond blues. It writes the SVGs to the
# `output` branch, which the README links to.
name: Contribution pond

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pond-snake.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pond-snake.svg?color_snake=#fb923c&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1e3a8a
            dist/pond-snake-dark.svg?palette=github-dark&color_snake=#fb923c&color_dots=#161b22,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
